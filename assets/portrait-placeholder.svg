<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- An obvious portrait placeholder for the practitioners section.
       DRAWN, NOT PHOTOGRAPHED, and in this category that matters more than
       anywhere else in the library: a stock photograph of a stranger in a
       clinical coat, sitting under a real practitioner's name and registration
       number, is a false claim about who a patient will be treated by. It is
       the same class of invented specific the legal placeholders exist to
       prevent, wearing a face. Replace this file with a real photograph. -->
  <rect width="400" height="400" rx="32" fill="#eef4f2"/>
  <rect x="14" y="14" width="372" height="372" rx="24" fill="none" stroke="#788a85"
        stroke-width="4" stroke-dasharray="16 12" opacity="0.9"/>
  <circle cx="200" cy="158" r="62" fill="#136457" opacity="0.22"/>
  <path d="M92 330a108 108 0 0 1 216 0Z" fill="#136457" opacity="0.16"/>
</svg>
